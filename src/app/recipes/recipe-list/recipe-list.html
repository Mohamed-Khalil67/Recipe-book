<br>
<div class="row">
    <div class="col-md-12">
        <div class="btn btn-primary">New Recipe</div>
    </div>
</div>
<br>
<div class="row">
    @for (recipeItem of recipes; track $index) {
    <div class="col-md-6">
        <div class="card" style="width: 16rem;">
            <img [src]="recipeItem.imagePath" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">{{ recipeItem.name}}</h5>
                <p class="card-text">{{recipeItem.description}}</p>
            </div>
        </div>
        <app-recipe-item></app-recipe-item>
    </div>
    }
</div>
