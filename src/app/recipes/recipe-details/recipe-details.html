<div class="row">
    <div class="col-md-12">
        <img [src]="recipe()?.imagePath" class="img-fluid" alt="">
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <h1>{{ recipe()?.name }}</h1>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="btn-group">
            <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown"
                aria-expanded="false">
                Manage Recipe
            </button>
            <ul class="dropdown-menu">
                <li><button type="button" class="dropdown-item">To shopping list</button></li>
                <li><button type="button" class="dropdown-item">Edit recipe</button></li>
                <li><button type="button" class="dropdown-item">Delete recipe</button></li>
            </ul>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <h3>{{recipe()?.description}}</h3>
    </div>
</div>


<div class="row">
    <div class="col-md-12">
        <h3>Ingrdients</h3>
    </div>
</div>
