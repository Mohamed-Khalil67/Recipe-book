<div class="row">
    <div class="col-md-10">
        <app-shopping-edit (ingredientAdded)="onIngredientAdded($event)"></app-shopping-edit>
        <hr>
        <ul class="list-group">
            @for(ingredient of ingredients; track ingredient){
            <a class="list-group-item list-group-item-action" style="cursor: pointer;">
                {{ ingredient.name }} - ({{ ingredient.amount }})
            </a>
            }
        </ul>
    </div>
</div>
